name: framework-compat

on:
  pull_request:
  push:
    branches: [main, master, consolidation]
  workflow_dispatch:
    inputs:
      core_ref:
        description: roost-core ref for the source-head candidate set
        required: false
        default: main
      kit_ref:
        description: roost-kit ref for the source-head candidate set
        required: false
        default: main
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: framework-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generated-consumer:
    strategy:
      fail-fast: false
      matrix:
        dependency-set: [minimum, released, source-head]
        scenario: [minimal, full]
        consumer-go: ["1.27.x"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build current generator
        run: go build -o "${RUNNER_TEMP}/roost" ./cmd/roost
      - name: generate scenario
        env:
          SET: ${{ matrix.dependency-set }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          version_args=()
          if [ "$SET" = minimum ]; then
            version_args=(-roost-core-version v1.14.0 -roost-kit-version v1.13.0 -codegen-version v1.15.0)
          fi
          if [ "$SET" = source-head ]; then
            # Transitional (consolidation branch): the consolidated layout is
            # only published as pre-releases, so pin them for the bootstrap
            # resolution; the workspace below then replaces both with source.
            # Remove once core v1.14.0 / kit v1.13.0 are tagged.
            version_args=(-roost-core-version v1.14.0-alpha.4 -roost-kit-version v1.13.0-alpha.1 -codegen-version latest)
          fi
          mods=configdata
          services=game
          template_args=()
          if [ "$SCENARIO" = full ]; then
            mods=configdata,etcd,redis,mongo,nats,sync,remote_entity,dataengine,nest,saga
            services=game,gate
            # The game template hosts account / mail / match / chat and wires
            # game to them, so the full scenario compiles roost-kit/service too.
            template_args=(-template game)
          fi
          "${RUNNER_TEMP}/roost" project new planet -module example.com/planet -out "${RUNNER_TEMP}/planet" -mods "$mods" -services "$services" "${version_args[@]}" "${template_args[@]}"
          if [ "$SCENARIO" = full ]; then
            cd "${RUNNER_TEMP}/planet"
            "${RUNNER_TEMP}/roost" add access player --service gate
            "${RUNNER_TEMP}/roost" add transport tcp
            # Player and its lifecycle come from -template game; the scenario
            # builds on them rather than adding them a second time.
            "${RUNNER_TEMP}/roost" add component Profile --entity Player
            "${RUNNER_TEMP}/roost" add dao Player --entity Player
            "${RUNNER_TEMP}/roost" add handler RenamePlayer --entity Player --component Profile
            "${RUNNER_TEMP}/roost" add protocol RenamePlayer --group game --handler player
            "${RUNNER_TEMP}/roost" add endpoint RenamePlayer --handler player
            "${RUNNER_TEMP}/roost" add skill Fireball
            "${RUNNER_TEMP}/roost" add saga GuildTransfer -service game -steps debit,credit
            # Pure-version scenarios exercise the transactional generate+tidy
            # path here. Source-head is compiled through go.work below because
            # its APIs may intentionally not exist in the latest tag yet.
            if [ "$SET" != source-head ]; then
              "${RUNNER_TEMP}/roost" generate
            fi
          fi
      - name: use current framework source through a temporary workspace
        if: matrix.dependency-set == 'source-head'
        working-directory: ${{ runner.temp }}/planet
        env:
          CORE_REF: ${{ inputs.core_ref || (github.ref_name == 'consolidation' && 'consolidation' || 'main') }}
          KIT_REF: ${{ inputs.kit_ref || (github.ref_name == 'consolidation' && 'consolidation' || 'main') }}
        run: |
          git clone --depth=1 https://github.com/tjbdwanghaibo/roost-core.git "${RUNNER_TEMP}/roost-core"
          git clone --depth=1 https://github.com/tjbdwanghaibo/roost-kit.git "${RUNNER_TEMP}/roost-kit"
          git -C "${RUNNER_TEMP}/roost-core" fetch --depth=1 origin "$CORE_REF"
          git -C "${RUNNER_TEMP}/roost-core" checkout --detach FETCH_HEAD
          git -C "${RUNNER_TEMP}/roost-kit" fetch --depth=1 origin "$KIT_REF"
          git -C "${RUNNER_TEMP}/roost-kit" checkout --detach FETCH_HEAD
          cd "${RUNNER_TEMP}"
          go work init ./planet ./roost-core ./roost-kit
          # The workspace go directive must be at least every member's own.
          # It used to be pinned DOWN to 1.25.0, because the framework runtime
          # modules supported a lower consumer lane than codegen did. They no
          # longer do: core and kit are go 1.27.0, so pinning the workspace
          # below that fails outright rather than exercising an older lane.
          # Codegen itself is already built and is intentionally not a member.
          go work edit -go=1.27.0
      - name: select generated-project Go compatibility version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.consumer-go }}
          cache-dependency-path: ${{ runner.temp }}/planet/go.sum
      - name: compile generated consumer and check idempotence
        working-directory: ${{ runner.temp }}/planet
        env:
          SET: ${{ matrix.dependency-set }}
        run: |
          if [ "$SET" = source-head ]; then
            go test ./...
            go vet ./...
            go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          else
            GOWORK=off go mod tidy
            GOWORK=off go mod verify
            "${RUNNER_TEMP}/roost" generate --check
            GOWORK=off go test ./...
            GOWORK=off go vet ./...
            GOWORK=off go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          fi
          for script in deploy/shell/*.sh deploy/docker/*.sh deploy/k8s/*.sh; do sh -n "$script"; done
          ROOST_IMAGE=ghcr.io/example/planet@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa ROOST_CONFIG_ROOT="$PWD/configs/service" docker compose -f deploy/docker/docker-compose.prod.yaml config --quiet
          kubectl kustomize deploy/k8s/overlays/staging >/dev/null
      - name: source workspace remains temporary and modules stay publishable
        if: matrix.dependency-set == 'source-head'
        working-directory: ${{ runner.temp }}/planet
        run: |
          test ! -e go.work
          if grep -qE '^[[:space:]]*replace[[:space:](]' go.mod; then echo "consumer go.mod has a replace directive"; exit 1; fi
      # The assembly gate. Three defects that every unit test and every
      # hand-wired integration test missed were found only by starting a
      # generated project for real: a ClientMod depending on the capability
      # name "bus", kit Mods depending on "health" / "nats.jetstream", and a
      # lifecycle file redeclaring FromRegistry. This step starts the
      # generated processes on the project's own dev compose stack and
      # requires each to reach `service init` and stay up.
      - name: boot the generated processes on the dev compose stack
        if: matrix.scenario == 'full'
        working-directory: ${{ runner.temp }}/planet
        env:
          SET: ${{ matrix.dependency-set }}
        run: |
          set -euo pipefail
          if [ "$SET" != source-head ]; then export GOWORK=off; fi
          docker compose -f deploy/dev/docker-compose.yaml up -d
          for _ in $(seq 1 45); do
            if docker compose -f deploy/dev/docker-compose.yaml exec -T mongo mongosh --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q '^1$'; then break; fi
            sleep 2
          done
          docker compose -f deploy/dev/docker-compose.yaml exec -T mongo mongosh --quiet --eval 'rs.status().ok' | grep -q '^1$'
          go build -o ./planet .
          boot() {
            local svc="$1" pid
            ./planet "$svc" --config "configs/service/config.$svc.yaml" >"$svc.boot.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 90); do
              if grep -q '"msg":"service init"' "$svc.boot.log"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            sleep 3
            if ! grep -q '"msg":"service init"' "$svc.boot.log" || ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::generated $svc process did not reach service init and stay up"
              tail -n 40 "$svc.boot.log"
              exit 1
            fi
            echo "$svc: service init reached, process alive"
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          }
          boot mail
          boot game
      - name: dev stack state (on failure)
        if: failure() && matrix.scenario == 'full'
        working-directory: ${{ runner.temp }}/planet
        run: |
          docker compose -f deploy/dev/docker-compose.yaml ps || true
          docker compose -f deploy/dev/docker-compose.yaml logs --tail=60 || true
          for log in *.boot.log; do echo "== $log"; tail -n 60 "$log"; done 2>/dev/null || true
      - name: tear down the dev stack
        if: always() && matrix.scenario == 'full'
        working-directory: ${{ runner.temp }}/planet
        run: docker compose -f deploy/dev/docker-compose.yaml down -v || true
