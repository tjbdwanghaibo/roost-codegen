name: framework-compat

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      core_ref:
        description: cube-core ref for the source-head candidate set
        required: false
        default: main
      kit_ref:
        description: cube-kit ref for the source-head candidate set
        required: false
        default: main
      skill_ref:
        description: roost-skill ref for the source-head candidate set
        required: false
        default: main
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: framework-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generated-consumer:
    strategy:
      fail-fast: false
      matrix:
        dependency-set: [minimum, released, source-head]
        scenario: [minimal, full]
        consumer-go: ["1.25.x", "1.26.x"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build current generator
        run: go build -o "${RUNNER_TEMP}/roost" ./cmd/roost
      - name: generate scenario
        env:
          SET: ${{ matrix.dependency-set }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          version_args=()
          if [ "$SET" = minimum ]; then
            version_args=(-roost-core-version v1.8.0 -roost-kit-version v1.8.0 -roost-skill-version v1.9.0 -codegen-version v1.7.0)
          fi
          mods=configdata
          services=game
          if [ "$SCENARIO" = full ]; then
            mods=configdata,etcd,redis,mongo,nats,sync,remote_entity,dataengine,nest,saga
            services=game,gate
          fi
          "${RUNNER_TEMP}/roost" project new planet -module example.com/planet -out "${RUNNER_TEMP}/planet" -mods "$mods" -services "$services" "${version_args[@]}"
          if [ "$SCENARIO" = full ]; then
            cd "${RUNNER_TEMP}/planet"
            "${RUNNER_TEMP}/roost" add access player --service gate
            "${RUNNER_TEMP}/roost" add transport tcp
            "${RUNNER_TEMP}/roost" add entity Player
            "${RUNNER_TEMP}/roost" add component Profile --entity Player
            "${RUNNER_TEMP}/roost" add dao Player --entity Player
            "${RUNNER_TEMP}/roost" add handler RenamePlayer --entity Player --component Profile
            "${RUNNER_TEMP}/roost" add protocol RenamePlayer --group game --handler player
            "${RUNNER_TEMP}/roost" add lifecycle Player --service game
            "${RUNNER_TEMP}/roost" add endpoint RenamePlayer --handler player
            "${RUNNER_TEMP}/roost" add skill Fireball
            "${RUNNER_TEMP}/roost" add saga GuildTransfer -service game -steps debit,credit
            # Pure-version scenarios exercise the transactional generate+tidy
            # path here. Source-head is compiled through go.work below because
            # its APIs may intentionally not exist in the latest tag yet.
            if [ "$SET" != source-head ]; then
              "${RUNNER_TEMP}/roost" generate
            fi
          fi
      - name: use current framework source through a temporary workspace
        if: matrix.dependency-set == 'source-head'
        working-directory: ${{ runner.temp }}/planet
        env:
          CORE_REF: ${{ inputs.core_ref || 'main' }}
          KIT_REF: ${{ inputs.kit_ref || 'main' }}
          SKILL_REF: ${{ inputs.skill_ref || 'main' }}
        run: |
          git clone --depth=1 https://github.com/tjbdwanghaibo/cube-core.git "${RUNNER_TEMP}/cube-core"
          git clone --depth=1 https://github.com/tjbdwanghaibo/cube-kit.git "${RUNNER_TEMP}/cube-kit"
          git clone --depth=1 https://github.com/tjbdwanghaibo/roost-skill.git "${RUNNER_TEMP}/roost-skill"
          git -C "${RUNNER_TEMP}/cube-core" fetch --depth=1 origin "$CORE_REF"
          git -C "${RUNNER_TEMP}/cube-core" checkout --detach FETCH_HEAD
          git -C "${RUNNER_TEMP}/cube-kit" fetch --depth=1 origin "$KIT_REF"
          git -C "${RUNNER_TEMP}/cube-kit" checkout --detach FETCH_HEAD
          git -C "${RUNNER_TEMP}/roost-skill" fetch --depth=1 origin "$SKILL_REF"
          git -C "${RUNNER_TEMP}/roost-skill" checkout --detach FETCH_HEAD
          cd "${RUNNER_TEMP}"
          go work init ./planet ./cube-core ./cube-kit ./roost-skill
          # The framework runtime modules support the lower consumer lane.
          # Codegen itself is already built and is intentionally not a member.
          go work edit -go=1.25.0
      - name: select generated-project Go compatibility version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.consumer-go }}
          cache-dependency-path: ${{ runner.temp }}/planet/go.sum
      - name: compile generated consumer and check idempotence
        working-directory: ${{ runner.temp }}/planet
        env:
          SET: ${{ matrix.dependency-set }}
        run: |
          if [ "$SET" = source-head ]; then
            go test ./...
            go vet ./...
            go run github.com/tjbdwanghaibo/cube-core/cmd/glsvet ./...
          else
            GOWORK=off go mod tidy
            GOWORK=off go mod verify
            "${RUNNER_TEMP}/roost" generate --check
            GOWORK=off go test ./...
            GOWORK=off go vet ./...
            GOWORK=off go run github.com/tjbdwanghaibo/cube-core/cmd/glsvet ./...
          fi
          for script in deploy/shell/*.sh deploy/docker/*.sh deploy/k8s/*.sh; do sh -n "$script"; done
          ROOST_IMAGE=ghcr.io/example/planet@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa ROOST_CONFIG_ROOT=configs/service docker compose -f deploy/docker/docker-compose.prod.yaml config --quiet
          kubectl kustomize deploy/k8s/overlays/staging >/dev/null
      - name: source workspace remains temporary and modules stay publishable
        if: matrix.dependency-set == 'source-head'
        working-directory: ${{ runner.temp }}/planet
        run: |
          test ! -e go.work
          ! grep -qE '^[[:space:]]*replace[[:space:](]' go.mod
