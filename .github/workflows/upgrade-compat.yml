name: upgrade-compat

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 2"

concurrency:
  group: upgrade-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  previous-project:
    strategy:
      fail-fast: false
      matrix:
        codegen: [v1.9.0, v1.10.0]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "${RUNNER_TEMP}/roost-current" ./cmd/roost
      - name: create historical project
        run: go run github.com/tjbdwanghaibo/roost-codegen/cmd/roost@${{ matrix.codegen }} project new planet -module example.com/planet -out "${RUNNER_TEMP}/planet" -mods configdata
      - name: upgrade without overwriting business files
        working-directory: ${{ runner.temp }}/planet
        run: |
          sha256sum internal/service/game/service.go > "${RUNNER_TEMP}/business.before"
          "${RUNNER_TEMP}/roost-current" project upgrade --root . -core latest -kit latest -skill latest -codegen latest
          sha256sum -c "${RUNNER_TEMP}/business.before"
          "${RUNNER_TEMP}/roost-current" project diff
          GOWORK=off go mod tidy
          GOWORK=off go test ./...
          GOWORK=off go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          cp roost.yaml "${RUNNER_TEMP}/roost.before"
          "${RUNNER_TEMP}/roost-current" project upgrade --root . -core latest -kit latest -skill latest -codegen latest
          cmp roost.yaml "${RUNNER_TEMP}/roost.before"
